# AKO Training Lab Registry
# Single source of truth for lab metadata, dependencies, and validation status.
# Add new labs by copying _templates/lab-walkthrough.md and appending here.
#
# node_provisioning: orthogonal to deploy_paths — [eksctl] | [eksctl, karpenter] | GKE: nodepool
# cloud_providers: [eks, gke] unless a lab is EKS-only (Karpenter path)
# deploy_paths: [kubectl] = Path A (OLM + kubectl apply); [helm] = Path B (Helm values)
# Main-cluster labs support both unless noted. Lab 2.6 upgrade-lab is eksctl MNG on EKS, GKE node pools on GKE.
# Lab 2.5 k8sNodeBlockList is supported on eksctl MNG and GKE node pools (not Karpenter).

sections:
  - id: "00-environment-setup"
    title: Environment Setup
    path: sections/00-environment-setup
    status: active
  - id: "01-scaling-and-capacity"
    title: Scaling & Capacity
    path: sections/01-scaling-and-capacity
    status: active
  - id: "02-maintenance-and-upgrade"
    title: Maintenance & Upgrade
    path: sections/02-maintenance-and-upgrade
    status: active
  - id: "03-security-and-authentication"
    title: Security & Authentication
    path: sections/03-security-and-authentication
    status: active
  - id: "04-all-flash-storage"
    title: All-flash Storage
    path: sections/04-all-flash-storage
    status: active
    cluster: all-flash
    note: "Optional — dedicated cluster, off by default (setup step 0.8)"
  - id: "99-future-section"
    title: Reserved for future sections
    path: sections/99-future-section
    status: stub

