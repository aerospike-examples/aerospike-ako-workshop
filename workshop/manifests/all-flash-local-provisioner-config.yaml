---
# Section 4 all-flash only: adds the local-ssd-fs (Filesystem) class to the
# provisioner config from manifests/aerospike_local_volume_provisioner.yaml.
# The local-ssd entry must stay identical to the one in that file.
#
# Both discovery dirs sit under /mnt/disks (writable tmpfs on GKE COS). A
# sibling path like /mnt/disks-fs cannot be created on COS.
apiVersion: v1
kind: ConfigMap
metadata:
  name: local-provisioner-config
  namespace: aerospike
data:
  useNodeNameOnly: "true"
  labelsForPV: |
    storageclass: local-ssd
  storageClassMap: |
    local-ssd:
       hostDir: /mnt/disks/data
       mountDir:  /mnt/disks/data
       blockCleanerCommand:
         - "/scripts/blkdiscard.sh"
       volumeMode: Block
       namePattern: "nvme*"
    local-ssd-fs:
       hostDir: /mnt/disks/index
       mountDir:  /mnt/disks/index
       volumeMode: Filesystem
       fsType: ext4
       namePattern: "nvme*"
