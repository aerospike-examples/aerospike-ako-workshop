# Kernel parameters required by index-type flash (Section 4, all-flash cluster only).
#
# A root Aerospike server sets these itself; AKO runs the server unprivileged, so a
# node-level DaemonSet has to set them before the pods start. Without them the
# server refuses to start an all-flash namespace.
#   https://aerospike.com/docs/database/learn/best-practices/#all-flash-deployment
#
# These vm.dirty_* values apply to the whole kernel, not just Aerospike — which is
# exactly why they belong on a dedicated cluster and not on the main curriculum one.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: all-flash-sysctl
  namespace: kube-system
  labels:
    app.kubernetes.io/name: all-flash-sysctl
    workshop.aerospike.com/component: all-flash
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: all-flash-sysctl
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: all-flash-sysctl
    spec:
      priorityClassName: system-node-critical
      hostPID: true
      hostNetwork: true
      tolerations:
        - operator: Exists
      nodeSelector:
        workshop.aerospike.com/storage: all-flash
      initContainers:
        - name: set-sysctls
          image: registry.k8s.io/build-image/debian-base:bookworm-v1.0.4
          securityContext:
            privileged: true
          command:
            - /bin/sh
            - -ec
            - |
              # debian-base does not ship procps; write /proc/sys (host-visible
              # for un-namespaced vm.* knobs) instead of calling sysctl.
              echo 1310720 > /proc/sys/vm/min_free_kbytes
              echo 16777216 > /proc/sys/vm/dirty_bytes
              echo 1 > /proc/sys/vm/dirty_background_bytes
              echo 1 > /proc/sys/vm/dirty_expire_centisecs
              echo 10 > /proc/sys/vm/dirty_writeback_centisecs
              grep . /proc/sys/vm/min_free_kbytes /proc/sys/vm/dirty_bytes \
                /proc/sys/vm/dirty_background_bytes /proc/sys/vm/dirty_expire_centisecs \
                /proc/sys/vm/dirty_writeback_centisecs
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
