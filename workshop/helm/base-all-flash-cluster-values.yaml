# GENERATED by scripts/labs/render-all-flash-manifests.py — do not edit by hand.
#
# Section 4 all-flash Helm values for AWS EKS (i8ge.3xlarge).
# Primary index lives on local NVMe (index-type flash), not in DRAM:
#   data  5 × 1000Gi raw block volumes (local-ssd)
#   index 1 × 600Gi filesystem volumes (local-ssd-fs) — one 640 GiB ext4 slice on the single NVMe; 600 GiB claimed
#   mounts-budget 644245094400 bytes = 600 GiB of index per node
#
# Requires the all-flash cluster from setup step 0.8 (vm.dirty_* kernel settings
# and the paired index/data NVMe slices are not present on the main cluster).
replicas: 3
enableDynamicConfigUpdate: true

image:
  repository: aerospike/aerospike-server-enterprise
  tag: "8.1.0.0"

podSpec:
  nodeSelector:
    workshop.aerospike.com/node-pool: baseline
  multiPodPerHost: false
  aerospikeContainer:
    # Sized for the all-flash node, not for a DRAM index: i8ge.3xlarge.
    resources:
      requests:
        cpu: "10"
        memory: 64Gi
      limits:
        cpu: "10"
        memory: 64Gi
  sidecars:
    - name: aerospike-prometheus-exporter
      image: aerospike/aerospike-prometheus-exporter:1.33.0
      ports:
        - containerPort: 9145
          name: exporter
      env:
        - name: AS_AUTH_USER
          value: exporter
        - name: AS_AUTH_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: auth-exporter-secret
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 100m
          memory: 128Mi

storage:
  localStorageClasses:
    - local-ssd
    - local-ssd-fs
  filesystemVolumePolicy:
    cascadeDelete: true
    initMethod: deleteFiles
  blockVolumePolicy:
    cascadeDelete: true
    initMethod: blkdiscardWithHeaderCleanup
    wipeMethod: blkdiscard
  volumes:
    - name: workdir
      source:
        persistentVolume:
          storageClass: ssd
          volumeMode: Filesystem
          size: 3Gi
      aerospike:
        path: /opt/aerospike
    - name: ns-data-1
      source:
        persistentVolume:
          storageClass: local-ssd
          volumeMode: Block
          accessModes: ["ReadWriteOnce"]
          size: 1000Gi
      aerospike:
        path: /dev/data/local1
    - name: ns-data-2
      source:
        persistentVolume:
          storageClass: local-ssd
          volumeMode: Block
          accessModes: ["ReadWriteOnce"]
          size: 1000Gi
      aerospike:
        path: /dev/data/local2
    - name: ns-data-3
      source:
        persistentVolume:
          storageClass: local-ssd
          volumeMode: Block
          accessModes: ["ReadWriteOnce"]
          size: 1000Gi
      aerospike:
        path: /dev/data/local3
    - name: ns-data-4
      source:
        persistentVolume:
          storageClass: local-ssd
          volumeMode: Block
          accessModes: ["ReadWriteOnce"]
          size: 1000Gi
      aerospike:
        path: /dev/data/local4
    - name: ns-data-5
      source:
        persistentVolume:
          storageClass: local-ssd
          volumeMode: Block
          accessModes: ["ReadWriteOnce"]
          size: 1000Gi
      aerospike:
        path: /dev/data/local5
    - name: ns-index-1
      source:
        persistentVolume:
          storageClass: local-ssd-fs
          volumeMode: Filesystem
          accessModes: ["ReadWriteOnce"]
          size: 600Gi
      aerospike:
        path: /mnt/index/1
    - name: aerospike-config-secret
      source:
        secret:
          secretName: aerospike-secret
      aerospike:
        path: /etc/aerospike/secret

aerospikeAccessControl:
  users:
    - name: admin
      secretName: auth-secret
      roles:
        - sys-admin
        - user-admin
    - name: app
      secretName: auth-app-secret
      roles:
        - read
        - write
    - name: exporter
      secretName: auth-exporter-secret
      roles: []

aerospikeConfig:
  service:
    feature-key-file: /etc/aerospike/secret/features.conf
  security: {}
  network:
    service:
      port: 3000
    fabric:
      port: 3001
    heartbeat:
      port: 3002
    admin:
      port: 3003
  namespaces:
    - name: test
      replication-factor: 2
      migrate-sleep: 0 # For demo purposes only
      partition-tree-sprigs: 16384  # 2^14 — raising this needs a cold restart
      # No indexes-memory-budget: the primary index is on flash, not in DRAM.
      index-type:
        type: flash
        mounts:
          - /mnt/index/1
        mounts-budget: 644245094400
      storage-engine:
        type: device
        devices:
          - /dev/data/local1
          - /dev/data/local2
          - /dev/data/local3
          - /dev/data/local4
          - /dev/data/local5
