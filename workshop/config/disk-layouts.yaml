# Instance-type NVMe partition layouts for nvme-bootstrap DaemonSet.
# Partitions are symlinked into /host/mnt/disks/ for local-volume-provisioner.
# Devices are discovered via nvme-cli (Amazon EC2 NVMe Instance Storage or
# Google local NVMe) — not hardcoded nvme names.
#
# i8g.2xlarge:  1900 GB instance store — 3× 512 GiB partitions on first local SSD
# i8g.4xlarge: 3750 GB instance store — 6× 512 GiB partitions on first local SSD
# i8g.8xlarge: 2× local SSD — 6× 512 GiB partitions on each disk (12 total)
# n2-highmem-8 / n2-highmem-16 (GKE): one GPT partition covering the entire
#   local NVMe (no leftover overprovisioning). Partitioning still primes the
#   disk (wipe GPT / blkdiscard path) before the provisioner publishes the PV.

force_layout: ""  # optional override (workshop.env NVME_DISK_LAYOUT); empty = use IMDS instance-type

layouts:
  i8g.2xlarge:
    instance_store: first
    partitions:
      - number: 1
        start: 0%
        end: 512GiB
      - number: 2
        start: 512GiB
        end: 1024GiB
      - number: 3
        start: 1024GiB
        end: 1536GiB

  i8g.4xlarge:
    instance_store: all
    instance_store_devices: 1
    partitions:
      - number: 1
        start: 0%
        end: 512GiB
      - number: 2
        start: 512GiB
        end: 1024GiB
      - number: 3
        start: 1024GiB
        end: 1536GiB
      - number: 4
        start: 1536GiB
        end: 2048GiB
      - number: 5
        start: 2048GiB
        end: 2560GiB
      - number: 6
        start: 2560GiB
        end: 3072GiB  # remainder of device left unallocated for overprovisioning

  i8g.8xlarge:
    instance_store: all
    instance_store_devices: 2
    partitions:
      - number: 1
        start: 0%
        end: 512GiB
      - number: 2
        start: 512GiB
        end: 1024GiB
      - number: 3
        start: 1024GiB
        end: 1536GiB
      - number: 4
        start: 1536GiB
        end: 2048GiB
      - number: 5
        start: 2048GiB
        end: 2560GiB
      - number: 6
        start: 2560GiB
        end: 3072GiB  # same 6× 512 GiB per disk; remainder unallocated on each

  n2-highmem-8:
    instance_store: all
    instance_store_devices: 2
    partitions:
      - number: 1
        start: 0%
        end: 100%

  n2-highmem-16:
    instance_store: all
    instance_store_devices: 4
    partitions:
      - number: 1
        start: 0%
        end: 100%

  default:
    mode: whole-device
    instance_store: all
